name: thel_dawasa
description: "The ultimate fuel day checker for the Sri Lankan common man - Thel Dawasa!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  provider: ^6.1.1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  add_2_calendar: ^3.0.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  intl: ^0.19.0
  url_launcher: ^6.3.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/hey.mp3
